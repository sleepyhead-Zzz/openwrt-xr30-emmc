name: XR30 eMMC production and rescue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr30-emmc-build
  cancel-in-progress: false

env:
  TZ: UTC
  OPENWRT_COMMIT: f0a60eee2fe051741c643ea6118718aae1ef17fb
  CCACHE_MAXSIZE: 4G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build template and XR30 adaptation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize environment and require 40 GiB free
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          mkdir -p logs reports
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev libzstd-dev python3 python3-setuptools \
            rsync swig unzip file wget curl ccache cmake ninja-build quilt patch diffutils \
            perl pkgconf time xsltproc zstd liblz4-tool cpio device-tree-compiler u-boot-tools \
            qemu-user-static binfmt-support squashfs-tools fdisk gdisk f2fs-tools
          sudo modprobe loop
          if ! sudo modprobe f2fs; then
            sudo apt-get -qq install "linux-modules-extra-$(uname -r)"
            sudo modprobe f2fs
          fi
          sudo modprobe squashfs
          sudo modprobe overlay
          sudo apt-get clean
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir
          df -hT /workdir | tee reports/disk-preflight.txt
          test "$(df -B1 --output=avail /workdir | tail -1)" -ge 42949672960
          python3 -m py_compile scripts/*.py
          bash -n diy-part1.sh diy-part2.sh scripts/build-phase.sh

      - name: Download actual USTC indexes without mirror fallback
        run: python3 scripts/repositories.py download 2>&1 | tee logs/ustc-download.log

      - name: Clone pinned official OpenWrt source
        run: |
          set -euo pipefail
          git init /workdir/openwrt
          git -C /workdir/openwrt remote add origin https://github.com/openwrt/openwrt.git
          git -C /workdir/openwrt fetch --depth=1 origin "$OPENWRT_COMMIT"
          git -C /workdir/openwrt checkout --detach FETCH_HEAD
          test "$(git -C /workdir/openwrt rev-parse HEAD)" = "$OPENWRT_COMMIT"
          ln -s /workdir/openwrt openwrt
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Restore downloads and compiler cache
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/.ccache
          key: xr30-25.12.5-${{ runner.os }}-${{ hashFiles('locks/**', '.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xr30-25.12.5-${{ runner.os }}-${{ hashFiles('locks/**', '.config') }}-
            xr30-25.12.5-${{ runner.os }}-

      - name: Update and install the locked official feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-update.log"
          while read -r type name url; do
            expected="${url##*^}"
            test "$(git -C "feeds/$name" rev-parse HEAD)" = "$expected"
          done < feeds.conf.default
          ./scripts/feeds install -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-install.log"
          bash "$GITHUB_WORKSPACE/diy-part2.sh" 2>&1 | tee "$GITHUB_WORKSPACE/logs/configure.log"
          cp .config "$GITHUB_WORKSPACE/reports/build.config"
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/reports/build-diffconfig.txt"

      - name: Download packages (maximum four workers)
        run: bash scripts/build-phase.sh download download
      - name: Build host tools
        run: bash scripts/build-phase.sh tools tools/install
      - name: Build toolchain
        run: bash scripts/build-phase.sh toolchain toolchain/install
      - name: Build official kernel and modules
        run: bash scripts/build-phase.sh kernel target/compile
      - name: Build selected packages and all kernel modules
        run: bash scripts/build-phase.sh packages package/compile
      - name: Assemble root filesystem for ABI and signature checks
        run: bash scripts/build-phase.sh rootfs package/install
      - name: Build unvalidated production and rescue images for recoverable diagnostics
        run: bash scripts/build-phase.sh initial-image target/install package/index

      - name: Verify official signatures and module compatibility
        run: python3 scripts/repositories.py verify openwrt 2>&1 | tee logs/compatibility.log

      - name: Reassemble root filesystem with gated USTC repositories
        run: bash scripts/build-phase.sh final-rootfs package/install
      - name: Build production and rescue images and signed same-build package indexes
        run: bash scripts/build-phase.sh image target/install package/index
      - name: Verify dependencies with the actual image package database
        run: python3 scripts/check_dependencies.py openwrt 2>&1 | tee logs/dependencies.log
      - name: Verify FIT, DTB, CPIO, hashes and package ABI
        run: |
          set -euo pipefail
          for kind in initramfs-recovery squashfs-sysupgrade; do
            images=(openwrt/bin/targets/mediatek/filogic/*cmcc_xr30-emmc-${kind}.itb)
            test "${#images[@]}" -eq 1
            test -f "${images[0]}"
            python3 scripts/verify_image.py "${images[0]}" reports 2>&1 | tee "logs/image-${kind}-checks.log"
          done

      - name: Execute official config generators under ARM64 emulation
        run: |
          set -euo pipefail
          mkdir test-root
          gzip -dc reports/initrd.cpio.gz | (cd test-root && sudo cpio -id --make-directories --no-absolute-filenames)
          sudo chown -R "$(id -u):$(id -g)" test-root
          sudo cp /usr/bin/qemu-aarch64-static test-root/usr/bin/
          sudo update-binfmts --enable qemu-aarch64
          mkdir -p test-root/dev
          sudo mknod -m 666 test-root/dev/null c 1 3
          python3 scripts/test_defaults.py test-root 2>&1 | tee logs/defaults.log
          python3 scripts/check_startup.py openwrt test-root 2>&1 | tee logs/startup.log

      - name: Verify GPT, 12 GiB writable root, ext4 persistence and upgrade isolation
        run: sudo python3 scripts/test_disk.py 2>&1 | tee logs/disk-checks.log

      - name: Collect validated candidate and reports
        run: |
          python3 scripts/collect.py | tee reports/result.txt
          cat reports/result.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated installation candidate (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr30-emmc-25.12.5-candidate-${{ github.run_number }}
          path: artifacts/candidate
          retention-days: 30
          if-no-files-found: error
      - name: Upload same-build target packages (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr30-emmc-same-build-packages-${{ github.run_number }}
          path: artifacts/same-build-packages
          retention-days: 30
          if-no-files-found: error

      - name: Save downloads and compiler cache, including failed builds
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /workdir/openwrt/dl
            /workdir/openwrt/.ccache
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Save disk usage and failure summary
        if: always()
        run: |
          mkdir -p reports logs
          df -hT > reports/disk-final.txt
          if test -d openwrt/logs; then cp -R openwrt/logs logs/openwrt; fi
          python3 scripts/save_diagnostics.py
          if ! test -f artifacts/candidate/STATUS.txt; then
            echo 'No validated candidate: build or offline checks incomplete/failed. Hardware not tested.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics even on failure (30 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr30-emmc-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            logs
            reports
          retention-days: 30
          if-no-files-found: warn
