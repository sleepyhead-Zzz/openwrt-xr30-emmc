name: Validate preserved XR30 RAM image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TZ: UTC
  XR30_SOURCE_BUILD_COMMIT: 3c80df8e3363fcbf138976285868e5f1f514241a
  XR30_SOURCE_BUILD_RUN_ID: '38670311345'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools only
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install qemu-user-static binfmt-support cpio fakeroot unzip
      - name: Download and authenticate the preserved build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/sleepyhead-Zzz/openwrt-xr30-emmc/actions/artifacts/11947707398/zip > preserved.zip
          echo '68856ba507d2077d23c0a1ecef7efc1e32cc370933f7842a93ce5f45a2a9d5a5  preserved.zip' | sha256sum -c -
          unzip -q preserved.zip -d saved
          python3 scripts/recover_build.py
      - name: Verify unchanged FIT and extract its actual root filesystem
        run: |
          set -euo pipefail
          mkdir -p logs test-root
          python3 scripts/verify_image.py openwrt/bin/targets/mediatek/filogic/*cmcc_xr30-emmc-initramfs-recovery.itb reports | tee logs/image-checks.log
          gzip -dc reports/initrd.cpio.gz | (cd test-root && sudo cpio -id --make-directories --no-absolute-filenames)
          sudo chown -R "$(id -u):$(id -g)" test-root
          sudo cp /usr/bin/qemu-aarch64-static test-root/usr/bin/
          sudo update-binfmts --enable qemu-aarch64
          mkdir -p test-root/dev
          sudo mknod -m 666 test-root/dev/null c 1 3
          root=$(find openwrt/build_dir -type d -name root-mediatek)
          cp -a test-root/etc/apk/. "$root/etc/apk/"
          cp -a test-root/lib/apk/. "$root/lib/apk/"
      - name: Recheck signatures and dependency resolution
        run: |
          set -euo pipefail
          for index in reports/indexes/*.adb; do
            openwrt/staging_dir/host/bin/apk --keys-dir "$PWD/test-root/etc/apk/keys" verify "$index"
          done
          python3 scripts/check_dependencies.py openwrt 2>&1 | tee logs/dependencies.log
      - name: Execute real network and wireless generators
        run: |
          set -euo pipefail
          python3 scripts/test_defaults.py test-root 2>&1 | tee logs/defaults.log
          python3 scripts/check_startup.py openwrt test-root 2>&1 | tee logs/startup.log
      - name: Collect validated unchanged image and reports
        run: |
          python3 scripts/collect.py | tee reports/result.txt
          cat reports/result.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated RAM-boot candidate (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr30-emmc-25.12.5-candidate-validated-${{ github.run_number }}
          path: artifacts/candidate
          retention-days: 30
          if-no-files-found: error
      - name: Upload same-build target packages (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr30-emmc-same-build-packages-validated-${{ github.run_number }}
          path: artifacts/same-build-packages
          retention-days: 30
          if-no-files-found: error
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr30-emmc-validation-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            reports
            logs
          retention-days: 30
          if-no-files-found: warn
